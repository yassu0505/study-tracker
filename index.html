<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Tracker</title>
  <style>
    :root{
      --bg:#f4f7fb; --card:#fff; --text:#162033; --muted:#748198;
      --primary:#4f7cff; --primary-soft:#eaf0ff; --line:#e7ebf2; --success:#2fb171;
      --warn:#b36b00; --warn-soft:#fff6df; --danger:#d64a4a; --shadow:0 14px 35px rgba(24,39,75,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:1050px;margin:0 auto;padding:28px 18px 60px}
    h1{margin:0;font-size:30px}.subtitle{margin:6px 0 24px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:360px 1fr;gap:20px}
    .card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);border:1px solid rgba(231,235,242,.7)}
    .card h2{font-size:18px;margin:0 0 16px}
    label{display:block;font-size:13px;color:var(--muted);margin:14px 0 7px}
    input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;font-size:15px;outline:none;color:var(--text)}
    input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
    textarea{min-height:80px;resize:vertical}
    button{border:none;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
    .primary{width:100%;background:var(--primary);color:#fff;margin-top:16px}
    .primary:active{transform:translateY(1px)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .hint{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}
    .save-status{font-size:12px;margin-top:10px;text-align:center;color:var(--success)}
    .save-status.warn{color:var(--warn)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    .stat{background:var(--primary-soft);padding:13px;border-radius:14px;min-width:0}
    .stat .num{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat .lab{font-size:11px;color:var(--muted);margin-top:3px}
    .unit-stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
    .unit-chip{font-size:13px;background:#f5f7fa;border:1px solid var(--line);border-radius:999px;padding:8px 11px}
    .unit-chip strong{margin-left:5px}
    .calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:10px}
    .calendar-head h2{margin:0}.nav{display:flex;gap:8px}.nav button{background:#f3f5f9;color:var(--text);padding:8px 11px}
    .weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    .weekdays div{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
    .day{min-height:92px;border:1px solid var(--line);border-radius:14px;padding:9px;position:relative;background:#fff;cursor:pointer;transition:.15s;overflow:hidden}
    .day:hover{transform:translateY(-1px);border-color:#cbd6ff}.day.empty{background:transparent;border-color:transparent;cursor:default}.day.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
    .date-num{font-size:13px;font-weight:700}.check{position:absolute;right:8px;top:8px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--success);color:#fff;font-weight:900}
    .day-summary{position:absolute;left:9px;right:6px;bottom:8px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .subject{font-size:11px;color:var(--primary);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
    .history{margin-top:20px}.history-item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.history-item:first-child{border-top:none}.history-main{min-width:0}.history-title{font-weight:700}.history-note{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;margin-top:3px}.history-value{color:var(--primary);font-weight:800;white-space:nowrap}.delete{background:#fff0f0;color:var(--danger);padding:6px 9px;margin-left:6px;font-size:12px}
    .empty-state{color:var(--muted);font-size:14px;padding:8px 0}
    .flash{background:#e9f8f0;color:#1c7d4e;border-radius:10px;padding:9px 11px;font-size:13px;margin-top:10px;display:none}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.day{min-height:76px;padding:7px}.subject{display:none}.day-summary{font-size:9px}.app{padding-top:20px}h1{font-size:26px}.stats{grid-template-columns:repeat(3,1fr)}.stat .num{font-size:19px}}
  </style>
</head>
<body>
  <main class="app">
    <h1>📚 Study Tracker</h1>
    <p class="subtitle">時間・ページ・章など、勉強した量を自分に合う単位で記録。</p>

    <div class="grid">
      <section>
        <div class="card">
          <h2>学習を記録</h2>
          <label for="date">日付</label>
          <input id="date" type="date" />

          <label for="subject">科目・教材</label>
          <input id="subject" placeholder="例：Python / 基本情報 / 英単語帳" />

          <div class="row">
            <div>
              <label for="recordType">記録の種類</label>
              <select id="recordType">
                <option value="minutes">時間</option>
                <option value="pages">ページ数</option>
                <option value="sections">章・セクション</option>
              </select>
            </div>
            <div>
              <label id="amountLabel" for="amount">学習時間（分）</label>
              <input id="amount" type="number" min="0.1" step="1" placeholder="例：60" inputmode="decimal" />
            </div>
          </div>
          <div class="hint" id="amountHint">勉強した時間を分単位で入力します。</div>

          <label id="rangeLabel" for="range">詳細（任意）</label>
          <input id="range" placeholder="例：学習した範囲や補足" />

          <label for="note">メモ</label>
          <textarea id="note" placeholder="理解したこと、次にやることなど"></textarea>
          <button class="primary" id="saveBtn" type="button">記録する</button>
          <div class="flash" id="flash">✓ 記録しました</div>
          <div class="save-status" id="saveStatus"></div>
        </div>

        <div class="card history">
          <h2>最近の記録</h2>
          <div id="historyList"></div>
        </div>
      </section>

      <section class="card">
        <div class="stats">
          <div class="stat"><div class="num" id="studyDays">0</div><div class="lab">今月の学習日数</div></div>
          <div class="stat"><div class="num" id="recordCount">0</div><div class="lab">今月の記録回数</div></div>
          <div class="stat"><div class="num" id="streak">0日</div><div class="lab">現在の連続学習</div></div>
        </div>
        <div class="unit-stats" id="unitStats"></div>

        <div class="calendar-head">
          <h2 id="monthTitle"></h2>
          <div class="nav"><button id="prevBtn" type="button">←</button><button id="todayBtn" type="button">今日</button><button id="nextBtn" type="button">→</button></div>
        </div>
        <div class="weekdays"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
        <div class="calendar" id="calendar"></div>
      </section>
    </div>
  </main>

<script>
(function(){
  'use strict';
  const STORAGE_KEY = 'studyTrackerRecordsV2';
  const LEGACY_KEY = 'studyTrackerRecordsV1';
  let storageAvailable = true;

  function readRecords(){
    try{
      const current = localStorage.getItem(STORAGE_KEY);
      if(current) return JSON.parse(current);
      const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]');
      if(legacy.length){
        return legacy.map(r => ({...r, type:'minutes', amount:Number(r.minutes || 0), range:''}));
      }
      return [];
    }catch(e){
      storageAvailable = false;
      return [];
    }
  }

  let records = readRecords();
  let viewDate = new Date();

  const $ = id => document.getElementById(id);
  const dateInput = $('date');
  const subjectInput = $('subject');
  const recordTypeInput = $('recordType');
  const amountInput = $('amount');
  const amountLabel = $('amountLabel');
  const amountHint = $('amountHint');
  const rangeInput = $('range');
  const rangeLabel = $('rangeLabel');
  const noteInput = $('note');
  const calendar = $('calendar');
  const monthTitle = $('monthTitle');
  const studyDays = $('studyDays');
  const recordCount = $('recordCount');
  const streak = $('streak');
  const unitStats = $('unitStats');
  const historyList = $('historyList');
  const saveStatus = $('saveStatus');
  const flash = $('flash');

  const TYPE_META = {
    minutes:{label:'時間', unit:'分', short:'分', field:'学習時間（分）', placeholder:'例：60', hint:'勉強した時間を分単位で入力します。', inputType:'number', inputMode:'decimal', rangeLabel:'詳細（任意）', rangePlaceholder:'例：演習問題1〜10'},
    pages:{label:'ページ', unit:'ページ', short:'p', field:'ページ数・範囲', placeholder:'例：25 / 20-45 / p.20〜45', hint:'ページ数でも範囲でも入力できます。範囲を入れた場合はページ数を自動計算します。', inputType:'text', inputMode:'text', rangeLabel:'詳細（任意）', rangePlaceholder:'例：第2章「データベース」'},
    sections:{label:'章・セクション', unit:'セクション', short:'節', field:'章・セクション', placeholder:'例：2-4 / 第3章 / Section 2〜4', hint:'数字だけでなく「第3章」「Section 2〜4」のような文字も入力できます。', inputType:'text', inputMode:'text', rangeLabel:'詳細（任意）', rangePlaceholder:'例：例題まで完了 / 復習あり'}
  };

  function localDateString(d = new Date()){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function makeId(){
    try{ if(window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID(); }catch(e){}
    return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }

  function saveRecords(){
    if(!storageAvailable) return false;
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      return true;
    }catch(e){
      storageAvailable = false;
      return false;
    }
  }

  function updateStorageStatus(){
    if(storageAvailable){
      saveStatus.textContent='この端末のブラウザに自動保存されます';
      saveStatus.className='save-status';
    }else{
      saveStatus.textContent='この表示環境では端末保存が使えないため、画面を閉じると記録が消える場合があります';
      saveStatus.className='save-status warn';
    }
  }

  function updateAmountUI(){
    const meta = TYPE_META[recordTypeInput.value];
    amountLabel.textContent = meta.field;
    amountInput.placeholder = meta.placeholder;
    amountHint.textContent = meta.hint;
    amountInput.type = meta.inputType;
    amountInput.inputMode = meta.inputMode;
    if(meta.inputType === 'number'){
      amountInput.min = '0.1';
      amountInput.step = '1';
    }else{
      amountInput.removeAttribute('min');
      amountInput.removeAttribute('step');
    }
    rangeLabel.textContent = meta.rangeLabel;
    rangeInput.placeholder = meta.rangePlaceholder;
    amountInput.value = '';
  }

  function parseStudyAmount(type, raw){
    const text = String(raw || '').trim();
    if(!text) return null;
    if(type === 'minutes'){
      const n = Number(text);
      return Number.isFinite(n) && n > 0 ? n : null;
    }
    const normalized = text.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[〜～–—]/g, '-');
    const rangeMatch = normalized.match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)/);
    if(rangeMatch){
      const a = Number(rangeMatch[1]), b = Number(rangeMatch[2]);
      if(Number.isFinite(a) && Number.isFinite(b) && b >= a) return type === 'pages' ? (b-a+1) : (Math.floor(b)-Math.floor(a)+1);
    }
    const onlyNumber = normalized.match(/^\s*(?:p\.?\s*)?(\d+(?:\.\d+)?)\s*(?:ページ|頁|章|節|section|sections)?\s*$/i);
    if(onlyNumber) return Number(onlyNumber[1]);
    if(type === 'sections' && /(?:第?\s*\d+\s*章|section\s*\d+)/i.test(normalized)) return 1;
    return null;
  }

  function groupedByDate(){
    return records.reduce((acc,r)=>{ (acc[r.date] ||= []).push(r); return acc; },{});
  }

  function getAmount(r){ const n=Number(r.amount ?? r.minutes); return Number.isFinite(n) ? n : 0; }
  function getType(r){ return r.type || 'minutes'; }

  function formatValue(r){
    const type=getType(r), meta=TYPE_META[type] || TYPE_META.minutes;
    if(r.rawAmount) return r.rawAmount;
    return `${getAmount(r)}${meta.unit}`;
  }

  function summarize(recordsForDay){
    const totals={minutes:0,pages:0,sections:0};
    recordsForDay.forEach(r=>{ const type=getType(r); if(type in totals) totals[type]+=getAmount(r); });
    return Object.entries(totals).filter(([,v])=>v>0).map(([type,v])=>`${v}${TYPE_META[type].short}`).join('・');
  }

  function currentStreak(){
    const set = new Set(records.map(r=>r.date));
    let d = new Date();
    if(!set.has(localDateString(d))){ d.setDate(d.getDate()-1); }
    let count=0;
    while(set.has(localDateString(d))){ count++; d.setDate(d.getDate()-1); }
    return count;
  }

  function render(){ renderCalendar(); renderHistory(); updateStorageStatus(); }

  function renderCalendar(){
    calendar.innerHTML='';
    const year=viewDate.getFullYear(), month=viewDate.getMonth();
    monthTitle.textContent=`${year}年 ${month+1}月`;
    const firstDay=new Date(year,month,1).getDay();
    const lastDate=new Date(year,month+1,0).getDate();
    const grouped=groupedByDate();

    for(let i=0;i<firstDay;i++){
      const empty=document.createElement('div'); empty.className='day empty'; calendar.appendChild(empty);
    }

    let monthStudyDays=0, monthRecords=0;
    const monthTotals={minutes:0,pages:0,sections:0};

    for(let day=1;day<=lastDate;day++){
      const key=localDateString(new Date(year,month,day));
      const dayRecords=grouped[key] || [];
      if(dayRecords.length){
        monthStudyDays++; monthRecords += dayRecords.length;
        dayRecords.forEach(r=>{ const type=getType(r); if(type in monthTotals) monthTotals[type]+=getAmount(r); });
      }

      const cell=document.createElement('div'); cell.className='day';
      if(key===localDateString()) cell.classList.add('today');
      const dateNum=document.createElement('div'); dateNum.className='date-num'; dateNum.textContent=day; cell.appendChild(dateNum);

      if(dayRecords.length){
        const check=document.createElement('div'); check.className='check'; check.textContent='✓';
        const subject=document.createElement('div'); subject.className='subject'; subject.textContent=dayRecords.map(r=>r.subject).filter(Boolean).join('・');
        const summary=document.createElement('div'); summary.className='day-summary'; summary.textContent=summarize(dayRecords);
        cell.append(check,subject,summary);
      }
      cell.addEventListener('click',()=>{
        dateInput.value=key;
        dateInput.scrollIntoView({behavior:'smooth',block:'center'});
      });
      calendar.appendChild(cell);
    }

    studyDays.textContent=monthStudyDays;
    recordCount.textContent=monthRecords;
    streak.textContent=`${currentStreak()}日`;
    unitStats.innerHTML='';
    const chips=[
      ['minutes', monthTotals.minutes, '分'],
      ['pages', monthTotals.pages, 'ページ'],
      ['sections', monthTotals.sections, '章']
    ];
    chips.forEach(([type,val,unit])=>{
      const chip=document.createElement('div'); chip.className='unit-chip';
      chip.innerHTML=`${TYPE_META[type].label}<strong>${val}${unit}</strong>`;
      unitStats.appendChild(chip);
    });
  }

  function renderHistory(){
    historyList.innerHTML='';
    const sorted=[...records].sort((a,b)=>`${b.date}${b.createdAt||''}`.localeCompare(`${a.date}${a.createdAt||''}`)).slice(0,10);
    if(!sorted.length){ historyList.innerHTML='<div class="empty-state">まだ記録がありません。</div>'; return; }
    sorted.forEach(r=>{
      const row=document.createElement('div'); row.className='history-item';
      const left=document.createElement('div'); left.className='history-main';
      const title=document.createElement('div'); title.className='history-title'; title.textContent=r.subject || '学習';
      const note=document.createElement('div'); note.className='history-note';
      const details=[r.date, TYPE_META[getType(r)]?.label, r.range, r.note].filter(Boolean); note.textContent=details.join(' ・ ');
      left.append(title,note);

      const right=document.createElement('div');
      const value=document.createElement('span'); value.className='history-value'; value.textContent=formatValue(r);
      const del=document.createElement('button'); del.className='delete'; del.type='button'; del.textContent='削除';
      del.addEventListener('click',()=>{ records=records.filter(x=>x.id!==r.id); saveRecords(); render(); });
      right.append(value,del); row.append(left,right); historyList.appendChild(row);
    });
  }

  function showFlash(){
    flash.style.display='block';
    window.clearTimeout(showFlash.timer);
    showFlash.timer=window.setTimeout(()=>{ flash.style.display='none'; },1800);
  }

  function saveEntry(){
    const date=dateInput.value;
    const rawAmount=amountInput.value.trim();
    const amount=parseStudyAmount(recordTypeInput.value, rawAmount);
    if(!date){ alert('日付を選んでください'); return; }
    if(!rawAmount){ alert('学習量を入力してください'); return; }
    if(recordTypeInput.value === 'minutes' && amount === null){ alert('学習時間を数字で入力してください'); return; }

    records.push({
      id:makeId(), date,
      subject:subjectInput.value.trim(),
      type:recordTypeInput.value,
      amount: amount ?? 0,
      rawAmount: recordTypeInput.value === 'minutes' ? '' : rawAmount,
      range:rangeInput.value.trim(),
      note:noteInput.value.trim(),
      createdAt:new Date().toISOString()
    });
    saveRecords();
    subjectInput.value=''; amountInput.value=''; rangeInput.value=''; noteInput.value='';
    const chosen=new Date(`${date}T00:00:00`); viewDate=new Date(chosen.getFullYear(),chosen.getMonth(),1);
    render(); showFlash();
  }

  dateInput.value=localDateString();
  recordTypeInput.addEventListener('change',updateAmountUI);
  $('saveBtn').addEventListener('click',saveEntry);
  $('prevBtn').addEventListener('click',()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);renderCalendar();});
  $('nextBtn').addEventListener('click',()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);renderCalendar();});
  $('todayBtn').addEventListener('click',()=>{viewDate=new Date();dateInput.value=localDateString();renderCalendar();});

  updateAmountUI();
  render();
})();
</script>
</body>
</html>
